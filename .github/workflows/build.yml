      - name: Inject mobile performance patch
        working-directory: game/dist
        run: |
          cat > performance-patch.js << 'JSEOF'
          (function() {
            // Capacitor WebView me userAgent me "Android" hota hai
            // Plus Capacitor ka apna flag check karo
            const isCapacitor = typeof window.Capacitor !== 'undefined' ||
                                /Capacitor/i.test(navigator.userAgent) ||
                                /Android/i.test(navigator.userAgent);
            const isMobile = isCapacitor || /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                             ('ontouchstart' in window) || window.innerWidth < 1024;

            if (isMobile) {
              document.documentElement.classList.add('is-mobile');
              document.documentElement.classList.remove('is-desktop');
              // Force mobile viewport
              Object.defineProperty(window, 'devicePixelRatio', {
                value: Math.min(window.devicePixelRatio || 1, 1.5),
                writable: false
              });
              // Force mobile layout width
              Object.defineProperty(window, 'innerWidth', {
                value: Math.min(window.innerWidth || 400, 800),
                writable: false
              });
            } else {
              document.documentElement.classList.add('is-desktop');
              document.documentElement.classList.remove('is-mobile');
            }
          })();
          JSEOF

          # index.html me viewport meta + patch script inject karo
          # Pehle viewport check karo
          if ! grep -q 'viewport' index.html; then
            sed -i 's|<head>|<head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">|' index.html
          fi

          # Performance patch HEAD me sabse pehle load karo
          sed -i 's|<head>|<head><script src="performance-patch.js"></script>|' index.html

          # Mobile CSS override — desktop layout ko force mobile me badlo
          cat >> index.html << 'HTMLEOF'
          <style>
            .is-mobile {
              width: 100vw !important;
              height: 100vh !important;
              overflow: hidden !important;
            }
            .is-mobile canvas {
              width: 100vw !important;
              height: 100vh !important;
              touch-action: none !important;
            }
            .is-mobile * {
              -webkit-tap-highlight-color: transparent;
              -webkit-touch-callout: none;
            }
            .is-mobile {
              user-select: none;
              -webkit-user-select: none;
            }
            /* Desktop-only elements hide karo mobile pe */
            .is-mobile .desktop-only,
            .is-mobile [data-desktop],
            .is-mobile .keyboard-hint,
            .is-mobile .wasd-hint {
              display: none !important;
            }
            /* Mobile-only elements dikhao */
            .is-mobile .mobile-controls,
            .is-mobile [data-mobile],
            .is-mobile .touch-controls {
              display: flex !important;
              display: block !important;
            }
          </style>
          HTMLEOF   
