name: Build Cricket Game (APK + EXE)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ==================== ANDROID APK ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone cricket game
        uses: actions/checkout@v4
        with:
          repository: anand1296/Crease
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build game (Vite)
        working-directory: game
        run: |
          npm install
          npm run build

      - name: Setup Capacitor
        working-directory: game
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # dist/ ko www/ me copy karo
          rm -rf www
          cp -r dist www

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.cricket.crease",
            "appName": "Crease Cricket",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Fix Kotlin duplicate classes
        working-directory: game/android/app
        run: |
          cat >> build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk

  # ==================== WINDOWS EXE ====================
  build-pc:
    runs-on: windows-latest
    steps:
      - name: Clone cricket game
        uses: actions/checkout@v4
        with:
          repository: anand1296/Crease
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build game (Vite)
        working-directory: game
        run: |
          npm install
          npm run build

      - name: Create Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app
          Copy-Item -Path "game\dist\*" -Destination "app\" -Recurse -Force

          @'
          {
            "name": "crease-cricket",
            "version": "1.0.0",
            "main": "main.js",
            "build": {
              "appId": "com.cricket.crease",
              "productName": "Crease Cricket",
              "win": { "target": "portable" }
            }
          }
          '@ | Set-Content -Path "app\package.json" -Encoding UTF8

          @'
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              fullscreen: true,
              autoHideMenuBar: true,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          '@ | Set-Content -Path "app\main.js" -Encoding UTF8

      - name: Install and Build EXE
        working-directory: app
        shell: pwsh
        run: |
          npm install electron@28 electron-builder@24 --save-dev
          npx electron-builder --win portable --publish never

      - name: List dist (debug)
        working-directory: app
        shell: pwsh
        run: Get-ChildItem -Recurse dist/ | Select-Object FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Windows-EXE
          path: app/dist/   
