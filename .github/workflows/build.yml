name: Build Cricket Game (APK + EXE 32-bit)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ==================== ANDROID APK ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone cricket game
        uses: actions/checkout@v4
        with:
          repository: anand1296/Crease
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build game (Vite)
        working-directory: game
        run: |
          npm install
          npm run build

      - name: Inject mobile performance patch
        working-directory: game/dist
        run: |
          # Performance + controls patch — Three.js mobile optimization
          cat > performance-patch.js << 'JSEOF'
          (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 1024;

            // Force touch controls on mobile, keyboard on desktop
            if (isMobile) {
              document.documentElement.classList.add('is-mobile');
              document.documentElement.classList.remove('is-desktop');
            } else {
              document.documentElement.classList.add('is-desktop');
              document.documentElement.classList.remove('is-mobile');
            }

            // Patch Three.js renderer for mobile performance
            const origCreateElement = document.createElement.bind(document);
            document.createElement = function(tag, ...args) {
              const el = origCreateElement(tag, ...args);
              if (tag === 'canvas' && isMobile) {
                // Cap pixel ratio, disable antialias
                const observer = new MutationObserver(() => {
                  const renderer = el.__three_renderer;
                  if (renderer) {
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
                  }
                });
                observer.observe(el, { attributes: true });
              }
              return el;
            };

            // Override devicePixelRatio for Three.js
            if (isMobile) {
              Object.defineProperty(window, 'devicePixelRatio', {
                value: Math.min(window.devicePixelRatio || 1, 1.5),
                writable: false
              });
            }

            // Disable shadows on mobile
            if (isMobile) {
              const origShadowMap = Object.getOwnPropertyDescriptor(THREE?.Renderer?.prototype, 'shadowMap') || null;
            }

            // Reduce shadow map size if Three.js loaded
            const checkAndPatch = setInterval(() => {
              const canvas = document.querySelector('canvas');
              if (canvas && canvas.__gl) {
                clearInterval(checkAndPatch);
              }
            }, 500);
          })();
          JSEOF

          # Patch index.html to load performance script BEFORE main bundle
          sed -i 's|<head>|<head><script src="performance-patch.js"></script>|' index.html

          # Also inject inline style for mobile touch
          cat >> index.html << 'HTMLEOF'
          <style>
            .is-mobile canvas { touch-action: none; }
            .is-mobile * { -webkit-tap-highlight-color: transparent; }
            .is-mobile { user-select: none; -webkit-user-select: none; }
          </style>
          HTMLEOF

      - name: Setup Capacitor
        working-directory: game
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          rm -rf www
          cp -r dist www

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.cricket.crease",
            "appName": "Crease Cricket",
            "webDir": "www",
            "android": {
              "backgroundColor": "#000000"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Enable hardware acceleration + fix WebView
        working-directory: game/android
        run: |
          # 1. AndroidManifest.xml me hardware acceleration ensure karo
          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "hardwareAccelerated" "$MANIFEST"; then
            sed -i 's|<application|<application android:hardwareAccelerated="true"|' "$MANIFEST"
          fi

          # 2. Custom MainActivity — WebView ko HARDWARE layer force karo
          mkdir -p app/src/main/java/com/cricket/crease
          cat > app/src/main/java/com/cricket/crease/MainActivity.java << 'JAVAEOF'
          package com.cricket.crease;

          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Force hardware layer on the WebView
                  runOnUiThread(() -> {
                      WebView webView = (WebView) findViewById(com.getcapacitor.R.id.bridgeWebView);
                      if (webView != null) {
                          webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                          webView.getSettings().setUseWideViewPort(true);
                          webView.getSettings().setLoadWithOverviewMode(true);
                          webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      }
                  });
              }
          }
          JAVAEOF

          # 3. build.gradle me MainActivity reference update karo
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's|com.getcapacitor.BridgeActivity|com.cricket.crease.MainActivity|g' app/src/main/AndroidManifest.xml
          fi

      - name: Fix Kotlin duplicate classes
        working-directory: game/android/app
        run: |
          cat >> build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk

  # ==================== WINDOWS EXE (32-BIT) ====================
  build-pc:
    runs-on: windows-latest
    steps:
      - name: Clone cricket game
        uses: actions/checkout@v4
        with:
          repository: anand1296/Crease
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build game (Vite)
        working-directory: game
        run: |
          npm install
          npm run build

      - name: Create Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app
          Copy-Item -Path "game\dist\*" -Destination "app\" -Recurse -Force

          @'
          {
            "name": "crease-cricket",
            "version": "1.0.0",
            "main": "main.js",
            "build": {
              "appId": "com.cricket.crease",
              "productName": "Crease Cricket",
              "win": {
                "target": "portable",
                "arch": ["ia32"]
              }
            }
          }
          '@ | Set-Content -Path "app\package.json" -Encoding UTF8

          @'
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              fullscreen: true,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webgl: true,
                experimentalWebGL: true
              }
            });
            win.loadFile('index.html');
            // Hide cursor during gameplay
            win.on('enter-html-full-screen', () => win.setMouseCursor('none'));
            win.on('leave-html-full-screen', () => win.setMouseCursor('default'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          '@ | Set-Content -Path "app\main.js" -Encoding UTF8

      - name: Install and Build EXE (32-bit)
        working-directory: app
        shell: pwsh
        run: |
          npm install electron@43 electron-builder@24 --save-dev
          npx electron-builder --win portable --ia32 --publish never

      - name: List dist (debug)
        working-directory: app
        shell: pwsh
        run: Get-ChildItem -Recurse dist/ | Select-Object FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Windows-EXE-32bit
          path: app/dist/   
