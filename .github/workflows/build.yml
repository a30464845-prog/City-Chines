name: Build Cricket Game (APK + EXE 32-bit)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone cricket game
        uses: actions/checkout@v4
        with:
          repository: anand1296/Crease
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Build game
        working-directory: game
        run: npm install && npm run build

      - name: Inject mobile patch
        working-directory: game/dist
        run: |
          cat > performance-patch.js << 'JSEOF'
          (function(){
            try{
              var isCapacitor=typeof window.Capacitor!=='undefined'||/Capacitor/i.test(navigator.userAgent)||/Android/i.test(navigator.userAgent);
              var isMobile=isCapacitor||/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window)||window.innerWidth<1024;
              if(isMobile){
                document.documentElement.classList.add('is-mobile');
                document.documentElement.classList.remove('is-desktop');
                Object.defineProperty(window,'devicePixelRatio',{value:Math.min(window.devicePixelRatio||1,1.5),writable:false});
              }else{
                document.documentElement.classList.add('is-desktop');
                document.documentElement.classList.remove('is-mobile');
              }
            }catch(e){}
          })();
          JSEOF
          if ! grep -q 'viewport' index.html; then
            sed -i 's|<head>|<head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">|' index.html
          fi
          sed -i 's|<head>|<head><script src="performance-patch.js"></script>|' index.html
          cat >> index.html << 'HTMLEOF'
          <style>
          .is-mobile{width:100vw!important;height:100vh!important;overflow:hidden!important;user-select:none;-webkit-user-select:none}
          .is-mobile canvas{width:100vw!important;height:100vh!important;touch-action:none!important}
          .is-mobile *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
          .is-mobile .desktop-only,.is-mobile [data-desktop],.is-mobile .keyboard-hint,.is-mobile .wasd-hint{display:none!important}
          .is-mobile .mobile-controls,.is-mobile [data-mobile],.is-mobile .touch-controls{display:flex!important;display:block!important}
          </style>
          HTMLEOF

      - name: Setup Capacitor
        working-directory: game
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf www
          cp -r dist www
          cat > capacitor.config.json << 'EOF'
          {"appId":"com.cricket.crease","appName":"Crease Cricket","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin
        working-directory: game/android/app
        run: |
          cat >> build.gradle << 'EOF'
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk

  build-pc:
    runs-on: windows-latest
    steps:
      - name: Clone cricket game
        uses: actions/checkout@v4
        with:
          repository: anand1296/Crease
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build game
        working-directory: game
        run: npm install && npm run build

      - name: Create Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app
          Copy-Item -Path "game\dist\*" -Destination "app\" -Recurse -Force
          @"
          {
            "name": "crease-cricket",
            "version": "1.0.0",
            "description": "Crease Cricket",
            "main": "main.js",
            "build": {
              "appId": "com.cricket.crease",
              "productName": "Crease Cricket",
              "win": { "target": "portable" }
            }
          }
          "@ | Set-Content -Path "app\package.json" -Encoding UTF8
          @"
          const {app,BrowserWindow}=require('electron');
          const http=require('http');
          const fs=require('fs');
          const path=require('path');
          const mime={'.html':'text/html','.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.svg':'image/svg+xml','.mp3':'audio/mpeg','.ogg':'audio/ogg','.wasm':'application/wasm','.glb':'model/gltf-binary','.gltf':'model/gltf+json'};
          function startServer(){
            const dir=__dirname;
            return new Promise(resolve=>{
              const server=http.createServer((req,res)=>{
                let fp=path.join(dir,req.url==='/'?'index.html':req.url);
                if(!fp.startsWith(dir))fp=path.join(dir,'index.html');
                fs.readFile(fp,(err,data)=>{
                  if(err){fs.readFile(path.join(dir,'index.html'),(e2,d2)=>{res.writeHead(200,{'Content-Type':'text/html'});res.end(d2||'')})}
                  else{const ext=path.extname(fp).toLowerCase();res.writeHead(200,{'Content-Type':mime[ext]||'application/octet-stream'});res.end(data)}
                });
              });
              server.listen(0,'127.0.0.1',()=>resolve(server.address().port));
            });
          }
          function c(){
            startServer().then(port=>{
              const w=new BrowserWindow({width:1280,height:720,fullscreen:true,autoHideMenuBar:true,webPreferences:{nodeIntegration:false,contextIsolation:true,webgl:true,experimentalWebGL:true}});
              w.loadURL('http://127.0.0.1:'+port+'/');
            });
          }
          app.whenReady().then(c);
          app.on('window-all-closed',()=>{if(process.platform!=='darwin')app.quit()});
          "@ | Set-Content -Path "app\main.js" -Encoding UTF8

      - name: Build EXE 32-bit
        working-directory: app
        shell: pwsh
        run: |
          npm install electron@43 electron-builder@24 --save-dev
          npx electron-builder --win portable --ia32 --publish never

      - name: List dist
        working-directory: app
        shell: pwsh
        run: Get-ChildItem -Recurse dist/ | Select-Object FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Windows-EXE-32bit
          path: app/dist/   
